<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="180" height="180" rx="36" fill="url(#grad1)"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Light bulb representing ideas -->
  <g transform="translate(90, 90)">
    <!-- Bulb body -->
    <ellipse cx="0" cy="-15" rx="22" ry="28" fill="#ffffff" opacity="0.95"/>
    
    <!-- Bulb filament/glow effect -->
    <circle cx="0" cy="-15" r="12" fill="#fbbf24" opacity="0.8"/>
    
    <!-- Bulb base -->
    <rect x="-12" y="8" width="24" height="8" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="-10" y="16" width="20" height="4" rx="1" fill="#ffffff" opacity="0.85"/>
    
    <!-- Spark/idea lines around bulb -->
    <line x1="-35" y1="-15" x2="-28" y2="-15" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="35" y1="-15" x2="28" y2="-15" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="-25" y1="-35" x2="-20" y2="-28" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="25" y1="-35" x2="20" y2="-28" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="-25" y1="5" x2="-20" y2="-2" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="25" y1="5" x2="20" y2="-2" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Collaboration dots (representing team) at bottom -->
    <circle cx="-20" cy="35" r="6" fill="#ffffff" opacity="0.7"/>
    <circle cx="0" cy="35" r="6" fill="#ffffff" opacity="0.7"/>
    <circle cx="20" cy="35" r="6" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
