kind = "web"
previewPath = "/"
title = "Clariva"
version = "1.0.0"
id = "artifacts/clariva-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22208

[services.development]
run = "pnpm --filter @workspace/clariva-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clariva-web", "run", "build" ]
publicDir = "artifacts/clariva-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22208"
BASE_PATH = "/"
