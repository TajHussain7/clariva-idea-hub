name: Deploy

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute release tags
        id: tags
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "release_tag=production-latest" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=staging-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: artifacts/api-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clariva-api:${{ steps.tags.outputs.release_tag }}
            ghcr.io/${{ github.repository_owner }}/clariva-api:${{ github.sha }}
          cache-from: type=gha,scope=api-server
          cache-to: type=gha,mode=max,scope=api-server

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: artifacts/clariva-web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ github.ref_name == 'main' && secrets.VITE_API_URL_PRODUCTION || secrets.VITE_API_URL_STAGING }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/clariva-web:${{ steps.tags.outputs.release_tag }}
            ghcr.io/${{ github.repository_owner }}/clariva-web:${{ github.sha }}
          cache-from: type=gha,scope=clariva-web
          cache-to: type=gha,mode=max,scope=clariva-web

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ github.ref_name == 'main' && secrets.RENDER_DEPLOY_HOOK_PRODUCTION || secrets.RENDER_DEPLOY_HOOK_STAGING }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Render deploy hook secret is missing."
            exit 1
          fi

          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
