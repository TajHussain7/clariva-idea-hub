name: Deploy

on:
  push:
    branches:
      - develop
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_pat }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute release tags
        id: tags
        run: |
          if [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "release_tag=staging-latest" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=develop-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: artifacts/api-server/Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.docker_username }}/clariva-api:${{ steps.tags.outputs.release_tag }}
            docker.io/${{ secrets.docker_username }}/clariva-api:${{ github.sha }}
          cache-from: type=gha,scope=api-server
          cache-to: type=gha,mode=max,scope=api-server

      # Frontend is deployed directly by Vercel from source — no Docker image needed.

      - name: Trigger Render deploy hook
        env:
          # RENDER_DEPLOY_HOOK is set as an Environment Secret in the matching
          # GitHub environment (develop / staging) so each branch automatically
          # uses its own Render service webhook URL.
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set for the '${{ github.ref_name }}' environment."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy hook triggered successfully for '${{ github.ref_name }}'."
