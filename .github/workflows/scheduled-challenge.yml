name: Scheduled Weekly Challenge Automation

on:
  schedule:
    # 11:00 AM PKT (Pakistan Standard Time, UTC+5) = 06:00 AM UTC
    # Runs every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  run-challenge-automation:
    name: Run Weekly Challenge Automation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and api-server
        run: pnpm --filter @workspace/api-server run build

      - name: Execute Challenge Automation Worker Cycle
        run: pnpm --filter @workspace/api-server run worker
