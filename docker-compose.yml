services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clariva
      POSTGRES_USER: clariva
      POSTGRES_PASSWORD: clariva
    ports:
      - "5432:5432"
    volumes:
      - clariva-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clariva -d clariva"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-server:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://clariva:clariva@postgres:5432/clariva
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-key-12345}
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
      AI_INTEGRATIONS_OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      AI_INTEGRATIONS_OPENROUTER_API_KEY: ${AI_INTEGRATIONS_OPENROUTER_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "3000:3000"

  clariva-web:
    build:
      context: .
      dockerfile: artifacts/clariva-web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    depends_on:
      - api-server
    ports:
      - "5173:80"

volumes:
  clariva-postgres:
